<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Recruitment Analytics Dashboard</title>
</head>
<body>
    <header>
        <div class="header-container">
            <h1 id="header-section-title">Recruitment Analytics</h1>
            <div class="tab-container">
                <button class="tab active" onclick="switchTab(); fetchCandidate();">Recruitment Analytics</button>
                <button class="tab jobpostings" onclick="switchTab(); fetchCandidate();">Job Postings</button>
            </div>
        </div>
    </header>
    <article>
        <div class="article-container">
            <div id="recruitmentAnalytics">
                <h2>Recruitment Analytics Content</h2>

                <div class="data-metrics">
                    <div class="metric">
                        <img class="data-metrics__image" src="images/dataMetricsComponent (1).svg">
                        <div class="metric__content">
                            <div class="metric__number">
                                160
                            </div>
                            <div class="metric__text">
                                Hired
                            </div>
                        </div>
                    </div>
                    <div class="metric">
                        <img class="data-metrics__image" src="images/dataMetricsComponent (1).svg">
                        <div class="metric__content">
                            <div class="metric__number">
                                5.6
                            </div>
                            <div class="metric__text">
                                Apps. per hire
                            </div>
                        </div>
                    </div>
                    
                    <div class="metric">
                        <img class="data-metrics__image" src="images/dataMetricsComponent (1).svg">
                        <div class="metric__content">
                            <div class="metric__number">
                                28.5                    
                            </div>
                            <div class="metric__text">
                                Days per hire                    
                            </div>
                        </div>
                    </div>
                    <div class="metric">
                        <img class="data-metrics__image" src="images/dataMetricsComponent (1).svg">
                        <div class="metric__content">
                            <div class="metric__number">
                                $540
                            </div>
                            <div class="metric__text">
                                Cost per hire
                            </div>
                        </div>
                    </div>
                    <div class="metric">
                        <img class="data-metrics__image" src="images/dataMetricsComponent (1).svg">
                        <div class="metric__content">
                            <div class="metric__number">
                                $540
                            </div>
                            <div class="metric__text">
                                Cost per hire
                            </div>
                        </div>
                    </div>
                    <div class="metric">
                        <img class="data-metrics__image" src="images/dataMetricsComponent (1).svg">
                        <div class="metric__content">
                            <div class="metric__number">
                                23                    
                            </div>
                            <div class="metric__text">
                                Closed Positions                
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div id="jobPostings" class="hidden">
                <h2>Job Postings Content</h2>

                <div class="candidate-summary-body">
                <div class="candidate-summary">
                    <div class="candidate-summary-header">
                        <h2>Candidates Summary</h2>
                        <button class="close-button">&times;</button>
                    </div>
                    <div class="table-container">
                        <table class="candidate-table">
                            <thead>
                                <tr>
                                    <th>Candidate Id</th>
                                    <th>Name</th>
                                    <th>Date Applied</th>
                                    <th>Resume</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody class="candidate-table-body" id="candidate-table-body">
                                
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </article>
    <script src="script.js"></script>
</body>
</html>
